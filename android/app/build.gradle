plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def verCode = project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
def verName = project.hasProperty('versionName') ? project.property('versionName') : "1.0.0"

android {
    namespace 'com.nakulkundra.vakta'
    compileSdk 34

    defaultConfig {
        applicationId "com.nakulkundra.vakta"
        minSdk 24
        targetSdk 34
        versionCode verCode
        versionName verName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets {
                srcDirs 'src/main/assets'
            }
        }
    }
}

// Automatically sync latest web assets into the Android assets folder
task copyWebAssets(type: Copy) {
    from('../../') {
        include 'index.html', 'vakta-core.js', 'app.js'
    }
    from('../../assets') {
        into 'assets'
    }
    into 'src/main/assets'
}

tasks.whenTaskAdded { task ->
    if (task.name == 'preBuild') {
        task.dependsOn copyWebAssets
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
